name: Release

# v* タグを push すると、拡張機能の zip を作って GitHub Releases に公開する。
# 例: manifest.json の version を 0.1.0 にして `git tag v0.1.0 && git push origin v0.1.0`
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: タグと manifest.json の version が一致するか確認
        run: |
          version=$(python3 -c 'import json;print(json.load(open("manifest.json"))["version"])')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::タグ ${GITHUB_REF_NAME} と manifest.json の version (${version}) が一致しません"
            exit 1
          fi

      - name: zip を作成
        id: build
        run: echo "zip=$(scripts/build-zip.sh dist)" >> "$GITHUB_OUTPUT"

      - name: Release を作成して zip を添付
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${{ steps.build.outputs.zip }}" \
            --title "${GITHUB_REF_NAME}" --generate-notes
