name: Bug report / バグ報告 / 问题反馈
description: Report something that does not work / うまく動かないことを報告 / 报告问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste your Codie's `local_secret`, credentials, or private page contents.
        `local_secret` や認証情報、見られたくないページの内容は貼らないでください。
        请不要粘贴 `local_secret`、凭据或私密页面内容。
  - type: textarea
    id: what
    attributes:
      label: What happened / 何が起きたか / 发生了什么
      description: What you asked Codie to do, and what happened instead. The error text Codie said is very helpful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected / 期待した動作 / 期望的行为
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 再現手順 / 复现步骤
      description: Include the site (URL, if not private) and the tool involved, e.g. click_element.
  - type: input
    id: ext
    attributes:
      label: Extension version / 拡張のバージョン / 扩展版本
      placeholder: "0.1.8"
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version and OS / Chrome のバージョンと OS / Chrome 版本和系统
      placeholder: "Chrome 142, Windows 11"
  - type: input
    id: fw
    attributes:
      label: CODE27 firmware / ファームウェア / 固件版本
      placeholder: "1.6.0"
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation setting / 確認設定 / 确认设置
      options:
        - label: The confirmation window was turned off / 確認をオフにしていた / 已关闭确认
