<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 340px; font: 13px/1.5 system-ui, sans-serif; margin: 12px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  section { margin: 10px 0; padding-top: 8px; border-top: 1px solid #ddd; }
  input[type=text], select, textarea { width: 100%; box-sizing: border-box; margin: 2px 0 6px; }
  textarea { height: 70px; font-family: monospace; }
  button { margin-right: 4px; }
  #status { font-weight: bold; }
  .online { color: #2e7d32; } .error { color: #c62828; } .muted { color: #666; font-size: 12px; }
</style>
<h1>Codie Chrome Tools</h1>
<div>状態: <span id="status">…</span> <span id="msg" class="muted"></span></div>

<section id="unpaired" hidden>
  <label>端末のアドレス<input type="text" id="deviceUrl" placeholder="http://192.168.0.39:8081"></label>
  <label>認証の種類
    <select id="scope">
      <option value="session">session(12時間・端末再起動で失効)</option>
      <option value="permanent">permanent(長期。PCに鍵を保存)</option>
    </select>
  </label>
  <button id="pairStart">ペアリング開始</button>
  <div id="codeBox" hidden>
    <p class="muted">端末に表示されたコードを入力してください。</p>
    <input type="text" id="code" placeholder="ペアリングコード">
    <button id="pairConfirm">確定</button><button id="pairCancel">キャンセル</button>
  </div>
  <details><summary class="muted">ブラウザーからのペアリングが拒否される場合</summary>
    <p class="muted">local_api.py で作った credentials.json の中身を貼り付けます(上の端末アドレスも入力)。</p>
    <textarea id="credsJson"></textarea><button id="importCreds">取り込む</button>
  </details>
</section>

<section id="paired" hidden>
  <div class="muted" id="pairInfo"></div>
  <p><button id="connect">接続</button><button id="disconnect">切断</button><button id="unpair">ペアリング解除</button></p>
  <label><input type="checkbox" id="confirmWrites"> クリック・入力・タブを閉じる操作は確認を要求する</label>
  <p class="muted">Chrome が起動している間だけ、Codie から Chrome を操作できます。ページの内容は Codie(AIモデル)に送られます。</p>
</section>
<div id="error" class="error"></div>
<script src="popup.js" type="module"></script>
